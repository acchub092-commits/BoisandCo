{% if messages %}
<div class="space-y-2 mb-4" id="django-messages">
  {% for message in messages %}
  <div x-data="{ show: true }"
       x-show="show"
       x-transition:leave="transition ease-in duration-200"
       x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 -translate-y-2"
       x-init="setTimeout(() => show = false, 4000)"
       class="flex items-center gap-3 p-4 rounded-lg text-sm font-medium
              {% if message.tags == 'success' %}bg-foret-50 text-foret-800 border border-foret-200
              {% elif message.tags == 'error' %}bg-red-50 text-red-800 border border-red-200
              {% elif message.tags == 'warning' %}bg-amber-50 text-amber-800 border border-amber-200
              {% else %}bg-blue-50 text-blue-800 border border-blue-200{% endif %}">

    {# Icône #}
    {% if message.tags == 'success' %}
      <svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
      </svg>
    {% endif %}

    <span class="flex-1">{{ message }}</span>
    <button @click="show = false" class="opacity-50 hover:opacity-100">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
      </svg>
    </button>
  </div>
  {% endfor %}
</div>
{% endif %}
