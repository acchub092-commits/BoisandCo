{% with ic=log.icon_color %}
<div class="flex items-start gap-3 px-4 py-3 border-b border-ardoise-50 last:border-0">
  <div class="w-7 h-7 rounded-full flex-shrink-0 flex items-center justify-center mt-0.5 {{ ic.1 }}">
    <svg class="w-3.5 h-3.5 {{ ic.0 }}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      {% if log.log_type == 'VALIDATION' %}
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      {% elif log.log_type == 'ASSIGNMENT' %}
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
      {% elif log.log_type == 'RDV_ADDED' or log.log_type == 'RDV_DONE' %}
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      {% elif log.log_type == 'DOCUMENT_ADDED' %}
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      {% else %}
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/>
      {% endif %}
    </svg>
  </div>
  <div class="flex-1 min-w-0">
    <p class="text-xs text-ardoise-700 leading-snug">{{ log.content }}</p>
    <div class="flex items-center gap-2 mt-0.5">
      {% if log.performed_by %}
      <span class="text-[10px] font-medium text-ardoise-600">{{ log.performed_by.get_full_name }}</span>
      <span class="text-[10px] text-ardoise-300">·</span>
      {% endif %}
      <span class="text-[10px] text-ardoise-400">{{ log.created_at|timesince }}</span>
    </div>
  </div>
</div>
{% endwith %}
