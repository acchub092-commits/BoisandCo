{% if projects %}
<div class="overflow-x-auto">
  <table class="min-w-full divide-y divide-ardoise-100">
    <thead>
      <tr>
        <th class="px-4 py-2 text-left text-xs font-semibold text-ardoise-500 uppercase tracking-wider">Référence</th>
        <th class="px-4 py-2 text-left text-xs font-semibold text-ardoise-500 uppercase tracking-wider">Projet</th>
        <th class="px-4 py-2 text-left text-xs font-semibold text-ardoise-500 uppercase tracking-wider">Statut</th>
        <th class="px-4 py-2 text-left text-xs font-semibold text-ardoise-500 uppercase tracking-wider">Avancement</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-ardoise-100">
      {% for project in projects %}
      <tr class="hover:bg-ardoise-50 transition-colors cursor-pointer"
          onclick="window.location='{% url 'projects:detail' project.pk %}'">
        <td class="px-4 py-3 text-sm font-mono text-ardoise-500">{{ project.reference }}</td>
        <td class="px-4 py-3">
          <p class="text-sm font-medium text-ardoise-900">{{ project.name }}</p>
          <p class="text-xs text-ardoise-400">{{ project.client_name }}</p>
        </td>
        <td class="px-4 py-3">
          <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium">
            {{ project.get_status_display }}
          </span>
        </td>
        <td class="px-4 py-3">
          <div class="flex items-center gap-2">
            <div class="flex-1 bg-ardoise-100 rounded-full h-1.5 min-w-16">
              <div class="bg-bois-500 h-1.5 rounded-full" style="width: {{ project.progress }}%"></div>
            </div>
            <span class="text-xs text-ardoise-500">{{ project.progress }}%</span>
          </div>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% else %}
<p class="text-center py-8 text-ardoise-400 text-sm">Aucun projet en cours.</p>
{% endif %}
