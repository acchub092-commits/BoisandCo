{% load static %}
{% if medias %}
<div class="flex items-center gap-1 flex-wrap">
  {% for media in medias %}
  <button type="button"
          @click="$dispatch('open-lightbox', { url: '{{ media.fichier.url|escapejs }}', type: '{{ media.type_media|escapejs }}' })"
          class="w-7 h-7 rounded border border-ardoise-200 overflow-hidden flex items-center justify-center bg-ardoise-50 hover:ring-2 hover:ring-foret-400 transition-shadow flex-shrink-0"
          title="{{ media.get_type_media_display }} — ajouté par {{ media.uploaded_par.get_full_name|default:media.uploaded_par.username|default:"—" }}">
    {% if media.type_media == 'VIDEO' %}
    <svg class="w-3.5 h-3.5 text-ardoise-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    {% else %}
    <img src="{{ media.fichier.url }}" class="w-full h-full object-cover" alt="">
    {% endif %}
  </button>
  {% endfor %}
</div>
{% else %}
<span class="text-ardoise-300 text-xs">—</span>
{% endif %}
