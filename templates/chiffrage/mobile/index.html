{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d3448">
  <meta name="color-scheme" content="light only">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Hope AppMobile</title>
  <link rel="manifest" href="{% static 'chiffrage_mobile/manifest.webmanifest' %}">
  <link rel="icon" href="{% static 'chiffrage_mobile/icons/icon-32.png' %}">
  <link rel="apple-touch-icon" href="{% static 'chiffrage_mobile/icons/icon-192.png' %}">
  <link rel="stylesheet" href="{% static 'chiffrage_mobile/styles.css' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app"><p style="text-align:center;padding:40px;color:#7a7267;">Chargement…</p></div>
  {{ statut_choices|json_script:"statut-choices-data" }}
  <script>
    window.VAPID_PUBLIC_KEY = "{{ vapid_public_key }}";
    window.STATUT_CHOICES = JSON.parse(document.getElementById('statut-choices-data').textContent);
    window.APP_VERSION = "{{ app_version }}";
  </script>
  <script src="{% static 'chiffrage_mobile/app.js' %}" defer></script>
</body>
</html>
