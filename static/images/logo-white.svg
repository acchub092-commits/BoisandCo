<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 90" role="img" aria-label="Bois&amp;Co">
  <!-- Bois -->
  <text x="8" y="55"
        font-family="Georgia, 'Palatino Linotype', serif"
        font-weight="700" font-size="46" fill="#f2e8d5" letter-spacing="-0.5">Bois</text>
  <!-- Cadre autour de & -->
  <rect x="122" y="5" width="44" height="56" rx="3"
        fill="none" stroke="#f2e8d5" stroke-width="2.5"/>
  <!-- & -->
  <text x="144" y="51"
        font-family="Georgia, 'Palatino Linotype', serif"
        font-weight="700" font-size="38" fill="#f2e8d5" text-anchor="middle">&amp;</text>
  <!-- Co -->
  <text x="173" y="55"
        font-family="Georgia, 'Palatino Linotype', serif"
        font-weight="700" font-size="46" fill="#f2e8d5" letter-spacing="-0.5">Co</text>
  <!-- Tagline -->
  <text x="8" y="76"
        font-family="Georgia, 'Palatino Linotype', serif"
        font-style="italic" font-size="9.5" fill="rgba(242,232,213,0.60)" letter-spacing="0.2">Matière vivante, intérieurs durables.</text>
</svg>
